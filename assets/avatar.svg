<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" role="img" aria-label="Cute pixel art avatar of a smiling Black woman with a wavy bob and high ponytail">
  <!-- backdrop -->
  <rect width="32" height="32" fill="#12121e"/>
  <rect x="2" y="2" width="28" height="28" fill="#0a0a12"/>

  <!-- ponytail (drawn first, sits behind/beside the head) -->
  <rect x="22" y="5" width="5" height="4" fill="#1c1210"/>
  <rect x="23" y="9" width="5" height="7" fill="#1c1210"/>
  <rect x="22" y="16" width="4" height="4" fill="#1c1210"/>
  <rect x="21" y="20" width="4" height="3" fill="#1c1210"/>
  <rect x="23" y="23" width="3" height="3" fill="#1c1210"/>
  <rect x="24" y="10" width="2" height="1" fill="#2e1f1a"/>
  <rect x="23" y="14" width="2" height="1" fill="#2e1f1a"/>
  <rect x="22" y="18" width="2" height="1" fill="#2e1f1a"/>

  <!-- face -->
  <rect x="9" y="9" width="13" height="10" fill="#8a5a3c"/>
  <rect x="10" y="19" width="11" height="1" fill="#8a5a3c"/>

  <!-- neck -->
  <rect x="13" y="20" width="6" height="3" fill="#6e4630"/>

  <!-- ears -->
  <rect x="21" y="12" width="2" height="3" fill="#8a5a3c"/>
  <rect x="22" y="13" width="1" height="1" fill="#6e4630"/>

  <!-- hair top / bangs -->
  <rect x="14" y="4" width="4" height="1" fill="#1c1210"/>
  <rect x="11" y="5" width="10" height="2" fill="#1c1210"/>
  <rect x="8" y="7" width="16" height="2" fill="#1c1210"/>
  <rect x="10" y="6" width="2" height="1" fill="#2e1f1a"/>

  <!-- left side hair (wavy steps framing cheek) -->
  <rect x="7" y="9" width="3" height="3" fill="#1c1210"/>
  <rect x="8" y="12" width="2" height="2" fill="#1c1210"/>
  <rect x="7" y="14" width="3" height="3" fill="#1c1210"/>
  <rect x="9" y="17" width="2" height="2" fill="#1c1210"/>
  <rect x="10" y="19" width="2" height="1" fill="#1c1210"/>

  <!-- right side hair tuft (before ear/ponytail gap) -->
  <rect x="22" y="9" width="2" height="3" fill="#1c1210"/>

  <!-- eyebrows -->
  <rect x="11" y="11" width="3" height="1" fill="#1c1210"/>
  <rect x="17" y="11" width="3" height="1" fill="#1c1210"/>

  <!-- eyes -->
  <rect x="11" y="12" width="2" height="2" fill="#0a0a12"/>
  <rect x="17" y="12" width="2" height="2" fill="#0a0a12"/>
  <rect x="12" y="12" width="1" height="1" fill="#ffffff"/>
  <rect x="18" y="12" width="1" height="1" fill="#ffffff"/>

  <!-- nose shadow -->
  <rect x="15" y="14" width="2" height="1" fill="#6e4630"/>

  <!-- blush -->
  <rect x="10" y="15" width="1" height="1" fill="#ff8ba7"/>
  <rect x="20" y="15" width="1" height="1" fill="#ff8ba7"/>

  <!-- smile -->
  <rect x="11" y="15" width="2" height="1" fill="#0a0a12"/>
  <rect x="18" y="15" width="2" height="1" fill="#0a0a12"/>
  <rect x="13" y="16" width="5" height="1" fill="#0a0a12"/>

  <!-- collar -->
  <rect x="12" y="22" width="3" height="1" fill="#f2f2f2"/>
  <rect x="17" y="22" width="3" height="1" fill="#f2f2f2"/>
  <rect x="13" y="23" width="6" height="1" fill="#f2f2f2"/>

  <!-- sweater -->
  <rect x="8" y="22" width="4" height="1" fill="#e8896f"/>
  <rect x="20" y="22" width="4" height="1" fill="#e8896f"/>
  <rect x="8" y="23" width="5" height="1" fill="#e8896f"/>
  <rect x="19" y="23" width="5" height="1" fill="#e8896f"/>
  <rect x="7" y="24" width="18" height="1" fill="#f3a68e"/>
  <rect x="7" y="25" width="18" height="4" fill="#e8896f"/>

  <!-- top scanline flourish -->
  <rect x="2" y="2" width="28" height="1" fill="#ff2fe0" opacity="0.25"/>
</svg>
